server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 500
    max-connections: 10000

spring:
  config:
    activate:
      on-profile: loadtest

  datasource:
    hikari:
      pool-name: EAMSLoadTestHikariCP
      maximum-pool-size: 100
      minimum-idle: 40
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  data:
    redis:
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 10
          max-wait: 5000ms

# Resilience & Rate Limiting tuned for Load Testing (Prevents artificial 429 throttling during load benchmarks)
eams:
  resilience:
    rate-limiting:
      enabled: true
      auth-limit-per-minute: 50000
      export-limit-per-minute: 10000
      general-limit-per-minute: 500000

logging:
  level:
    root: WARN
    com.company.eams: INFO
    org.hibernate: WARN
    org.springframework.web: WARN
