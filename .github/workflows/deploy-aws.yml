name: EAMS CD - Deploy to AWS ECS Fargate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: eams-production-cluster
  BACKEND_SERVICE: eams-backend-service
  FRONTEND_SERVICE: eams-frontend-service
  BACKEND_TASK_DEFINITION: deploy/aws/ecs-task-backend.json
  FRONTEND_TASK_DEFINITION: deploy/aws/ecs-task-frontend.json

jobs:
  deploy:
    name: Build, Push to ECR & Deploy to ECS Fargate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------------------------
      # 1. Build & Push Backend Container Image
      # ------------------------------------------------------------------------
      - name: Build, Tag, and Push Backend Image to Amazon ECR
        id: build-backend-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/eams-backend:$IMAGE_TAG ./eams-backend
          docker tag $ECR_REGISTRY/eams-backend:$IMAGE_TAG $ECR_REGISTRY/eams-backend:latest
          docker push $ECR_REGISTRY/eams-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/eams-backend:latest
          echo "backend_image=$ECR_REGISTRY/eams-backend:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # 2. Build & Push Frontend Container Image
      # ------------------------------------------------------------------------
      - name: Build, Tag, and Push Frontend Image to Amazon ECR
        id: build-frontend-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/eams-frontend:$IMAGE_TAG ./eams-frontend
          docker tag $ECR_REGISTRY/eams-frontend:$IMAGE_TAG $ECR_REGISTRY/eams-frontend:latest
          docker push $ECR_REGISTRY/eams-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/eams-frontend:latest
          echo "frontend_image=$ECR_REGISTRY/eams-frontend:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # 3. Render Task Definitions with New Image Tags
      # ------------------------------------------------------------------------
      - name: Fill Backend Image in Task Definition
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.BACKEND_TASK_DEFINITION }}
          container-name: eams-backend
          image: ${{ steps.build-backend-image.outputs.backend_image }}

      - name: Fill Frontend Image in Task Definition
        id: task-def-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.FRONTEND_TASK_DEFINITION }}
          container-name: eams-frontend
          image: ${{ steps.build-frontend-image.outputs.frontend_image }}

      # ------------------------------------------------------------------------
      # 4. Zero-Downtime Rolling Deployment to ECS Services
      # ------------------------------------------------------------------------
      - name: Deploy Backend to Amazon ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-backend.outputs.task-definition }}
          service: ${{ env.BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy Frontend to Amazon ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-frontend.outputs.task-definition }}
          service: ${{ env.FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
