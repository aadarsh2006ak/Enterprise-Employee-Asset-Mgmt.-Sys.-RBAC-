version: "3.9"

services:
  # ==============================================================================
  # 1. PostgreSQL 15 Relational Database
  # ==============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: eams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eams}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eams}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - eams-network

  # ==============================================================================
  # 2. Redis 7 In-Memory Cache & Distributed Store
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: eams-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "notice"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - eams-network

  # ==============================================================================
  # 3. Spring Boot 3.3 Backend Service
  # ==============================================================================
  backend:
    build:
      context: ./eams-backend
      dockerfile: Dockerfile
    container_name: eams-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-eams}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eams-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  eams-network:
    driver: bridge
