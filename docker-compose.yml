version: "3.9"

services:
  # ==============================================================================
  # 1. PostgreSQL 15 Relational Database
  # ==============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: eams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eams}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eams}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - eams-network

  # ==============================================================================
  # 2. Redis 7 In-Memory Cache & Distributed Store
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: eams-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "notice"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - eams-network

  # ==============================================================================
  # 3. Spring Boot 3.3 Backend Service
  # ==============================================================================
  backend:
    build:
      context: ./eams-backend
      dockerfile: Dockerfile
    container_name: eams-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=loadtest
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-eams}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-39cf4a14a092cf9310b9e8f430eb1c3325d22ba390a80a44bf8bbd7521345a9c}
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - eams-network

  # ==============================================================================
  # 4. React Vite + Tailwind Frontend (Nginx Reverse Proxy)
  # ==============================================================================
  frontend:
    build:
      context: ./eams-frontend
      dockerfile: Dockerfile
    container_name: eams-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eams-network

  # ==============================================================================
  # 5. Prometheus (Metrics Collection & Scraper)
  # ==============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eams-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend
    networks:
      - eams-network

  # ==============================================================================
  # 6. Grafana (Live Enterprise Observability Dashboards)
  # ==============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: eams-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - eams-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  eams-network:
    driver: bridge
